[package]
name = "keylink"
version = "0.1.0"
edition = "2021"
# Verified, not inherited: `cargo +1.91 check --workspace --all-targets
# --all-features` passes. iroh 1.0.3 and iroh-blobs 0.103.0 both declare 1.91,
# so this is the floor the dependency graph already imposes, and adding blobs
# does not raise it. `mise run msrv` keeps the number honest.
rust-version = "1.91"
description = "Typed peer-to-peer RPC over iroh, with a schema-derived ALPN and fail-closed authorization."
license = "MIT OR Apache-2.0"
repository = "https://github.com/pedrocunha/keylink"

[features]
default = ["blocking", "fs", "env"]
# The synchronous API. Needs OS threads, so it cannot exist in a browser.
blocking = []
# `Body::from_file`. Needs a filesystem.
fs = []
# `Node::bind_from_env` and `Allowlist::from_env`. Needs a process environment.
env = []
# The browser's answer to `fs`. Off by default, because it is meaningful on
# exactly one target.
web = ["dep:wasm-streams", "dep:web-sys", "dep:tokio-util"]

[dependencies]
iroh = { workspace = true }
n0-future = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
postcard-schema = { workspace = true }
postcard-rpc = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
pastey = { workspace = true }
# `sync` is DECLARED, not inherited. It was arriving by feature unification from
# iroh, and `time` arrived from netwatch alone — one supplier for a feature
# `actor.rs` cannot compile without. A build that is green because somebody
# else's dependency happened to turn a feature on is green by accident, and it
# breaks on an unrelated upgrade. `sync` compiles for the browser; `rt` and
# `time` are no longer needed here at all, because the runtime and clock items
# moved to n0_future.
#
# Only the io adapters and channels. Everything with a syscall behind it is in
# the target block below.
tokio = { version = "1", default-features = false, features = ["io-util", "sync"] }

# Scoped by target rather than by cargo feature, on purpose. A feature that
# enabled `tokio/fs` would fail inside mio, several crates away from the
# mistake. Scoped this way, `--features blocking` on wasm fails in keylink's own
# `compile_error!` instead, which says what to do about it.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
iroh = { version = "1.0.3", default-features = false, features = [
    "tls-ring",
    "metrics",
    "portmapper",
    "fast-apple-datapath",
] }
tokio = { version = "1", default-features = false, features = [
    "io-util",
    "sync",
    "rt",
    "rt-multi-thread",
    "macros",
    "fs",
    "time",
    "signal",
] }

# The browser's body sources. Scoped to the browser target so that `web` on a
# native build is inert rather than a resolution failure.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasm-streams = { version = "0.5", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Blob",
    "File",
    "ReadableStream",
] }
tokio-util = { version = "0.7", optional = true, default-features = false, features = [
    "compat",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
