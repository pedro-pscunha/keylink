[package]
name = "keylink"
version = "0.1.0"
edition = "2021"
# Verified, not inherited: `cargo +1.91 check --workspace --all-targets
# --all-features` passes. iroh 1.4.1 and iroh-blobs 0.104.0 both declare 1.91,
# so this is the floor the dependency graph already imposes, and adding blobs
# does not raise it. `mise run msrv` keeps the number honest.
rust-version = "1.91"
description = "Typed peer-to-peer RPC over iroh, with a schema-derived ALPN and fail-closed authorization."
license = "MIT OR Apache-2.0"
repository = "https://github.com/pedro-pscunha/keylink"

[features]
default = ["blocking", "fs", "env", "persist-file"]
# The synchronous API. Needs OS threads, so it cannot exist in a browser.
blocking = []
# `Body::from_file`. Needs a filesystem.
fs = []
# `Node::bind_from_env` and `Allowlist::from_env`. Needs a process environment.
env = []
# `Persist`: the `Observer` that stores the state after every turn.
#
# Over the PORT and nothing else — the frame, `Snapshots` and `Claim` — so it
# compiles for the browser and `.mise/tasks/wasm` builds it there. It is useless
# without an adapter, which is the next feature.
persist = ["dep:keylink-persist"]
# The above, plus `keylink-persist`'s local-file adapter.
#
# A second switch and not one, because this is the half that needs a filesystem:
# it turns on `tokio/fs` inside `keylink-persist`, and `lib.rs` refuses it on
# wasm beside the same refusal for `blocking`, `fs` and `env`. Default for the
# same reason those three are — a native build gets the adapter that exists.
persist-file = ["persist", "keylink-persist/file"]
# The browser's answer to `fs`. Off by default, because it is meaningful on
# exactly one target.
web = ["dep:wasm-streams", "dep:web-sys", "dep:tokio-util"]
# `Blobs::persistent`. Turns on iroh-blobs' `fs-store`, which pulls redb and
# reflink-copy. Off by default so that `Blobs::memory` costs neither: a store
# that needs no disk and no feature is the one a reader should reach first.
blobs-fs = ["iroh-blobs/fs-store"]

[dependencies]
iroh = { workspace = true }
n0-future = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
postcard-schema = { workspace = true }
postcard-rpc = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
pastey = { workspace = true }
# Parses startup authorization rules. Already present in the resolved graph.
toml = { workspace = true }
# For one 16-byte digest: `CallId`, which folds the calling peer into the hash of
# its idempotency key so a handler can dedupe a retry without being handed the
# ledger's peer-scoping rule to re-implement.
#
# It adds an edge and not a crate. blake3 is already resolved here three
# times over — `bao-tree`, `iroh` and `iroh-relay` all name it — so this changes
# what keylink is allowed to call, not what it compiles. Check with
# `cargo tree -i blake3`.
#
# `default-features = false` drops `std`, which this use does not need: a
# `Hasher`, two `update`s and a fixed-size `finalize`. Whoever else in the graph
# wants `std` asks for it themselves, and cargo unions the two. Declared rather
# than inherited, for the reason the `tokio` line below says at length.
blake3 = { version = "1", default-features = false }
# `default-features = false` drops `fs-store` (redb, reflink-copy) and `rpc`
# (noq). Both are what makes the default build small, and `rpc` is the one that
# refuses `wasm32-unknown-unknown` outright, through mio. The `blobs-fs` feature
# adds `fs-store` back for whoever asks for a disk.
#
# iroh-blobs' own `iroh` dependency is `1.0.0, default-features = false`, so it
# adds no iroh features to this graph and cannot quietly re-enable a browser
# blocker.
iroh-blobs = { version = "0.104.0", default-features = false }
# Named for exactly one type: `BaoContentItem`, which sits in the public
# signature of `iroh_blobs::get::request::GetBlobItem` and which iroh-blobs does
# not re-export. `BlobHandle::copy_to` has to match on it to stream leaves
# without buffering the blob, because the only alternative iroh-blobs offers —
# awaiting `GetBlobResult` — collects the whole payload into memory and gives up
# the one-chunk peak this crate promises everywhere else.
#
# Version-coupled to iroh-blobs on purpose. If the two ever disagree, cargo
# resolves two copies and the type stops matching, which is a loud build failure
# rather than a silent one.
bao-tree = { version = "0.17", default-features = false }
# `sync` is DECLARED, not inherited. It was arriving by feature unification from
# iroh, and `time` arrived from netwatch alone — one supplier for a feature
# `actor.rs` cannot compile without. A build that is green because somebody
# else's dependency happened to turn a feature on is green by accident, and it
# breaks on an unrelated upgrade. `sync` compiles for the browser; `rt` and
# `time` are no longer needed here at all, because the runtime and clock items
# moved to n0_future.
#
# Only the io adapters and channels. Everything with a syscall behind it is in
# the target block below.
tokio = { version = "1", default-features = false, features = ["io-util", "sync"] }

# The durability port, for `src/persist.rs`. It USED to be a dev-dependency, with
# a comment saying it was test-only and that proving the wiring from the test side
# was how the hexagon was kept pointing the right way. Half of that stopped being
# true when the adapter moved into the library, and this is the rewrite rather
# than a rule the change broke.
#
# What is unchanged, and is the part that mattered: **`keylink-persist` does not
# depend on `keylink`.** The port must not know the framework, and it does not —
# it compiles, tests and documents alone. This arrow is the application depending
# on the port, which is the direction a hexagon's arrows are supposed to point,
# and the reason a `keylink-durable` crate in between would be a seam with one
# adapter inside it.
#
# What changed: the dependency is real, so tests name it as a normal dependency
# rather than a dev one. `--no-default-features` therefore takes it out of the
# integration tests too, exactly as it takes out the blocking API they use.
#
# **This used to be the end of the sentence, and the end of the story.** It said
# so, `mise.toml`'s `lint` said so, and `.mise/tasks/features` argued for it — that
# `keylink/tests/` simply could not build at the all-off end, so no tool ever
# looked. It builds now: every item that needs the adapter carries
# `#[cfg(feature = "persist-file")]`, every item that needs the synchronous API
# carries `#[cfg(feature = "blocking")]`, and `examples/durable_ledger.rs` declares
# `required-features` below. `.mise/tasks/features` runs
# `cargo check -p keylink --all-targets --no-default-features` and holds the
# argument for why that is worth its build.
#
# Nothing moved into `default` to get there. A caller who writes
# `default-features = false` gets exactly what they got before.
#
# `default-features = false` drops the file adapter, and with it `tokio/fs`.
# `persist-file` adds it back for whoever has a disk.
#
# **`version` beside `path`, and it is not optional decoration.** cargo strips an
# unversioned dev-dependency when it packages, so this line was fine while it was
# one; a real dependency without a version requirement is
# `error: all dependencies must have a version requirement specified when
# packaging`, and `cargo package -p keylink` failed from the commit that promoted
# it. `mise run package` is the gate that says so now.
keylink-persist = { path = "../keylink-persist", version = "0.1.0", optional = true, default-features = false }

# Scoped by target rather than by cargo feature, on purpose. A feature that
# enabled `tokio/fs` would fail inside mio, several crates away from the
# mistake. Scoped this way, `--features blocking` on wasm fails in keylink's own
# `compile_error!` instead, which says what to do about it.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
iroh = { version = "1.4.1", default-features = false, features = [
    "tls-ring",
    "metrics",
    "portmapper",
    "fast-apple-datapath",
] }
tokio = { version = "1", default-features = false, features = [
    "io-util",
    "sync",
    "rt",
    "rt-multi-thread",
    "macros",
    "fs",
    "time",
    "signal",
] }

# The browser's body sources. Scoped to the browser target so that `web` on a
# native build is inert rather than a resolution failure.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
# **`0.5` and not `0.6`, and the reason is a link error nobody could see.**
#
# `wasm-streams` exports its glue with `#[wasm_bindgen]`, so its symbols are
# named per crate and not per version — `__wbg_intounderlyingbytesource_free`
# and nineteen more. `reqwest`, which iroh-relay pulls in on this target, asks
# for `0.5`; cargo will not unify that with `0.6`, so a `web` build carried both
# and `rust-lld` refused the module with TWENTY `duplicate symbol` errors — a
# count measured with `grep -o 'duplicate symbol: [^ ]*' | sort -u | wc -l`, not
# eyeballed from the tail of the log. **No wasm consumer of this crate could
# link.**
#
# `mise run wasm-web` was green throughout, and correctly so: it builds a
# LIBRARY, and an rlib is not linked. The collision needs a wasm binary to
# appear, which is what `mise run wasm-browser` produces and why that task found
# this on its first run.
#
# The downgrade costs nothing here. `from_raw` and `try_into_async_read` have
# the same signatures in both, down to the error type, and `src/body.rs` calls
# nothing else. Move back to `0.6` when reqwest does — and then keep
# `wasm-browser` in the gate, because it is the only check that would notice.
wasm-streams = { version = "0.5", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Blob",
    "File",
    "ReadableStream",
] }
tokio-util = { version = "0.7", optional = true, default-features = false, features = [
    "compat",
] }

# **Scoped by target for the reason the runtime dependencies above are, and it
# is not decoration.** Cargo builds `[dev-dependencies]` for whatever target a
# test target is built for, so an unscoped table put `tokio/full` and iroh's
# relay stack on `wasm32-unknown-unknown` the moment anything ran
# `cargo test --target wasm32-unknown-unknown`. Measured: it stopped at
# `error: This wasm target is unsupported by mio. If using Tokio, disable the
# net feature.` before one line of keylink was compiled.
#
# Nothing on a native build changes. Everything under `keylink/tests/` except
# `browser.rs` needs both of these and gets both of them.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dev-dependencies]
tokio = { version = "1", features = ["full"] }
# For `examples/bridge.rs` and nothing else. The external-service seam takes a
# method name and a BYTE BODY, so a worked example of it needs a wire format the
# outside world actually speaks — and keylink's own is postcard, which would
# demonstrate the mechanism while hiding the motive. A dev-dependency, so it
# reaches examples and tests and never a published build.
serde_json = { workspace = true }
# `test-utils` ships iroh's relay and its pkarr/DNS server as libraries, so
# `keylink/tests/relay.rs` can run both in-process. Without it every test in this
# repo binds `presets::Minimal`, and the relay and discovery paths — the ones
# `Node::bind` actually takes — have no coverage at all.
#
# It is a dev-dependency and nothing else, so it reaches tests and never a
# published build. It is not free: it pulls iroh-relay's server stack, an ACME
# client and a certificate generator among them. That is the price of testing
# the relay without a container, and `mise run deny` is what keeps the new
# crates honest.
iroh = { workspace = true, features = ["test-utils"] }

# What `keylink/tests/browser.rs` needs, and nothing else in this repository has
# a use for. Scoped so that a native `cargo test` neither resolves nor builds
# them, and so that `--all-features` on a native host cannot drag a browser
# harness into the graph.
#
# `wasm-bindgen-test` is version-coupled to the `wasm-bindgen-test-runner`
# binary `mise.toml` pins: the runner refuses a module built against a different
# `wasm-bindgen`, by version, in its own words. Bumping one without the other is
# a red `mise run wasm-browser`, which is the right way round.
#
# `js-sys` and `web-sys` are here to BUILD the inputs — a `File` out of a string,
# a default `ReadableStream` — not to test them. `web-sys`'s features are the
# same three `keylink`'s own `web` feature turns on, because they are the three
# the constructors under test take and return.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "File", "ReadableStream"] }

[lints]
workspace = true

# `required-features` and not a `#![cfg]` at the top of the file, because this is
# the one target shape where the file-level gate does not work: an example needs a
# `fn main`, and `#![cfg(..)]` that is false removes it, which is
# `error[E0601]: main function not found` rather than a skipped target. cargo
# skips a target whose required features are off, so `--all-targets` at
# `--no-default-features` never reaches it.
#
# `mise run examples` runs at default features, where `persist-file` is on, so
# the example still runs in the gate. Declaring it here does NOT disable
# autodiscovery — `reliable_call` needs no entry and has none.
[[example]]
name = "durable_ledger"
required-features = ["persist-file"]

# The same rule, for the same reason. `payment_approval` stores the treasury
# through `Persist` and the `Files` adapter, so it needs the half of the feature
# that brings a filesystem with it.
[[example]]
name = "payment_approval"
required-features = ["persist-file"]

# `persist` and NOT `persist-file`, and the difference is the example's subject.
# `replay_guard` writes its own `Snapshots` adapter over a `Vec<u8>`, so it needs
# the port and never the filesystem half. Declaring the wider feature would work
# and would misreport what the file depends on.
[[example]]
name = "replay_guard"
required-features = ["persist"]

# The authoritative gate combines native integration modules into one libtest
# process. `test = false` keeps ordinary `cargo test` and `clippy --all-targets`
# from running/linting the same sources twice; the canonical tasks select it by name.
[[test]]
name = "gate"
path = "gate-tests/gate.rs"
test = false

# `blobs-fs` is NOT a default feature, so `mise run examples` runs this one with
# an explicit `--features blobs-fs`. Declared here so that a build without the
# feature SKIPS the target rather than failing inside iroh-blobs.
[[example]]
name = "cold_store"
required-features = ["blobs-fs", "fs"]

# `gatehouse` reads its allowlist and one node identity out of the environment,
# which is exactly what the `env` feature is. It is a default feature, so this
# changes nothing for `mise run examples` and everything for
# `.mise/tasks/features`, which builds every target at `--no-default-features`.
[[example]]
name = "gatehouse"
required-features = ["env"]

# The synchronous API is a default feature, and `toolroom` is the only target
# that exercises it. Declared so that `--no-default-features` skips it rather
# than failing on a module that is not compiled.
[[example]]
name = "toolroom"
required-features = ["blocking"]
