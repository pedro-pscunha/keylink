[package]
name = "keylink-openapi"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pedrocunha/keylink"
description = "OpenAPI 3.1 and JSON Schema documents for a keylink-http surface"

[dependencies]
keylink = { path = "../keylink", version = "0.1.0", default-features = false }
keylink-http = { path = "../keylink-http", version = "0.1.0" }
# Draft 2020-12 by default, which is the dialect OpenAPI 3.1 requires. This
# dependency and the JSON model below live HERE and nowhere else: a `service!`
# user who wants no documents pays for neither.
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# `service!` names these in the code it generates, so a crate that writes a
# declaration declares them. `keylink` re-exporting them would put its own
# dependency names into every consumer's namespace.
postcard-schema = { workspace = true }
serde = { workspace = true }
schemars = "1"
tower = "0.5"
blake3 = { workspace = true }

[lints]
workspace = true
