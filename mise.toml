# keylink's gate, defined once — and now defined only here.
#
# **GitHub Actions is disabled and this file is the whole gate.** The workflow
# used to call these same tasks, which is why nothing here had to change when it
# went: there was never a second copy of the commands. What did change is that a
# green `mise run gate` is no longer a prediction about a second run somewhere
# else. It is the run. See README.md for what that costs.
#
#   mise tasks           # every task
#   mise run gate        # the whole gate
#   mise run pre-commit  # the fast subset the commit hook runs
#   mise run pre-push    # the heavy subset the push hook runs
#
# The compiler, its components and the wasm target come from rust-toolchain.toml,
# because rustup is the only thing that can install a component. mise owns the
# task layer and the tools cargo does not ship.
#
# `[task_config].includes` is deliberately NOT set: setting it replaces
# auto-discovery entirely, so a new file task under .mise/tasks/ would silently
# not load until somebody remembered to list it.

[tools]
# Pinned here so a fresh clone and CI get the same advisory checker, and so the
# version that produced a green `mise run deny` is recorded.
#
# `aqua:` rather than `cargo:` — the cargo backend compiles cargo-deny from
# source and takes minutes. It is also the backend this developer's global mise
# config already uses for the same tool, so the two share one install path
# instead of fetching the same binary twice under different schemes.
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"

# The `framing` task is a grep, and a grep whose tool is "whatever is on PATH"
# is a gate that passes on a machine without it. Pinned so it fails the same way
# everywhere, including on a CI image that does not ship ripgrep.
"aqua:BurntSushi/ripgrep" = "14.1.1"

# ── the whole gate ──────────────────────────────────────────────────────────

[tasks.gate]
description = "The whole gate. There is no other one — CI is disabled"
# A list of task references runs them ONE AT A TIME, in order. Bare `depends`
# lets mise parallelize, and parallel cargo invocations contend for the same
# target directory and the same memory.
#
# **This used to be "everything CI runs", and CI ran three things it did not.**
# When the workflow was disabled, `wasm-guards`, `msrv` and `deny` were the
# difference, so they moved here in the same change. Disabling a gate and
# dropping what only it covered are two separate acts, and doing the first
# without the second is how coverage disappears without anybody deciding to
# drop it.
#
# Cheapest failures first, with one deliberate exception: `deny` needs no
# compile at all and sits early, so a fresh advisory fails in seconds rather
# than after the test suite.
run = [
    { task = "framing" },
    { task = "anchors" },
    # Immediately after the task it guards, and in both lists rather than only in
    # `pre-commit`, because `anchors` is in both: a guard that does not run where the
    # thing it guards runs is a guard on paper. It asserts that `anchors` reports each
    # failure class as itself — the defect that reached `main` once was a passing gate
    # printing the anchor-rot playbook, which no green/red check can see.
    { task = "anchors-selftest" },
    { task = "fmt-check" },
    { task = "deny" },
    { task = "lint" },
    { task = "features" },
    { task = "test" },
    { task = "examples" },
    { task = "docs" },
    { task = "wasm" },
    { task = "wasm-guards" },
    { task = "wasm-web" },
    { task = "package" },
    { task = "msrv" },
]

# ── what the hooks run ──────────────────────────────────────────────────────

[tasks.pre-commit]
description = "Fast enough that nobody is tempted to bypass it. Seconds, warm"
run = [
    { task = "framing" },
    { task = "anchors" },
    { task = "anchors-selftest" },
    { task = "fmt-check" },
    { task = "lint-fast" },
]

[tasks.pre-push]
description = "The heavy gate. A push is rarer than a commit"
run = [{ task = "gate" }]

# ── formatting ──────────────────────────────────────────────────────────────

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Fail if anything is unformatted"
run = "cargo fmt --all -- --check"

# ── linting ─────────────────────────────────────────────────────────────────

[tasks.lint-fast]
description = "Clippy on the library only, so the commit hook stays seconds"
# Catches what a --all-targets run would, minus the test and example targets
# that dominate the build time.
run = "cargo clippy -p keylink --lib --all-features -- -D warnings"

[tasks.lint]
description = "Clippy at both feature ends, every target"
# --no-default-features is scoped to the library on purpose: the integration
# tests use the blocking API, so they cannot compile without it.
run = [
    "cargo clippy --all-targets --all-features -- -D warnings",
    "cargo clippy -p keylink --lib --no-default-features -- -D warnings",
]

# ── tests ───────────────────────────────────────────────────────────────────

[tasks.test]
description = "The whole workspace"
run = "cargo test --workspace"

[tasks.examples]
description = "Every example RUNS. Building one asserts nothing"
# `cargo test --workspace` compiles the examples and never executes one, so
# `reliable_call`'s assertions — the retry did not re-run the work, and the key
# settled `Done` afterwards — were dead code in the gate while the README said
# the recipe was "compiled by the gate and run over two nodes". Half of that was
# true.
#
# Named one at a time rather than `--examples`, because that flag builds them
# and there is no cargo verb that runs them all. A new example must be added
# here, and a reviewer who notices it is missing is the only check there is.
run = [
    "cargo run -p keylink --example reliable_call",
    "cargo run -p keylink --example durable_ledger",
]

# ── documentation ───────────────────────────────────────────────────────────

[tasks.docs]
description = "rustdoc as a gate, not as decoration"
# `#![warn(missing_docs)]` is a warning, and a warning nothing denies is
# decoration. This is what turns it into a gate, and it catches broken
# intra-doc links in the same pass.
#
# `keylink-persist` declares `missing_docs` too and was not listed here, so its
# own gate was decoration until this line named it.
#
# ── TWO KNOWN HOLES IN THIS GATE. Both measured, neither closed here.
#
# 1. WITHOUT `--document-private-items`, rustdoc does not resolve intra-doc links
#    in private items at all — not the item, not its doc comment, not a
#    `#[cfg(test)] mod` inside it. That is most of the prose in this crate: every
#    private module's header and every break record in a unit-test module.
#
#    Turning it on is NOT free, which is why it is not on.
#
#    A SNAPSHOT AND NOT A STANDING COUNT — the numbers below were measured on
#    2026-08-07 (-03:00) and are being actively fixed, so expect them to fall. The
#    offset is there so this snapshot can be ordered against another one. Do not read
#    a smaller count as this comment being wrong; re-measure with
#    `RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --document-private-items
#    --all-features -p keylink -p keylink-persist` and turn the flag on for good
#    when it reaches zero. What does not go stale is the shape: private items are
#    unchecked today, and that is the reason to finish the job.
#
#    As measured: **48 errors across 12 files** — 40 `redundant explicit link
#    target`, which are mechanical, and **8 genuinely unresolved links that no
#    gate in this repo had ever seen**:
#      console.rs   `Allowlist`, `Self::follow`, `Self::on_events` (x2)
#      local.rs     `crate::System::stop`, `crate::Busy`
#      macros.rs    `Addressed`
#      watch.rs     `LocalActor::spawn_supervised`
#    Flipping the flag without fixing those 48 lands a red gate on the default
#    branch, so it wants its own pass across files several branches own. The 8
#    above are real broken links in shipped documentation and are worth fixing
#    on their own merits.
#
# 2. `tests/*.rs` is unreachable EITHER WAY. cargo builds integration tests as
#    separate crates and never hands them to rustdoc, so a broken intra-doc link
#    in `keylink/tests/` is invisible to every gate here. It happened: an
#    `APPLIED_CAPACITY` -> `APPLIED_BOUND` rename left a dangling
#    `[`APPLIED_CAPACITY`]` in `tests/persist.rs` and this task stayed green.
#    There is no cheap fix — `cargo rustdoc -p keylink --test persist` cannot
#    link the crate graph — so the standing remedy is to grep for the old name
#    after any rename that touches a documented item. Stated rather than worked
#    around, because a workaround nobody maintains is worse than a known hole.
run = "RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --all-features -p keylink -p keylink-persist"

# ── shipping ────────────────────────────────────────────────────────────────

[tasks.package]
description = "Both crates still package, so neither has become unpublishable"
# A manifest can stop being publishable without one line of code changing, and
# nothing else in this gate looks. It happened: Wave 5 promoted `keylink-persist`
# from a dev-dependency to a real one, and cargo strips unversioned dev-deps when
# it packages — so `keylink` went from packaging fine to
# `error: all dependencies must have a version requirement specified when
# packaging`, silently, in a commit about durability. `keylink-persist` was also
# `publish = false`, which would have refused the publish a second way.
#
# `--no-verify` skips the rebuild from the packaged tarball, which the rest of
# this gate has already done from the same sources. What is being checked is the
# manifest, and that is what fails.
#
# `--allow-dirty` because this runs on a working tree, including in the commit
# path.
#
# `--exclude demo` and not `-p keylink -p keylink-persist`: `demo` is
# `publish = false` and depends on `keylink` by path with no version, which is
# correct for a demo and is a manifest error for anything shipped. Excluding by
# name means a NEW workspace member is checked by default, which is the way round
# that fails loudly.
run = "cargo package --workspace --exclude demo --no-verify --allow-dirty"

# ── supply chain ────────────────────────────────────────────────────────────

[tasks.msrv]
description = "Compile on the oldest Rust keylink claims to support"
# **In `gate` since CI was disabled, and the cost it used to dodge is real.** It
# needs a second toolchain — a ~200 MB download the first time — which is why it
# sat outside the gate while CI carried it. Nobody carries it now, and an MSRV
# nobody compiles is a promise broken silently: `rust-version` changes what cargo
# tells a user on an old compiler, so a wrong one sends them to the wrong place.
#
# Paying it once per clone beat dropping the guarantee. If that trade stops being
# worth it, take this out of `gate` **and** say who runs it instead — not one
# without the other.
run = "cargo +1.91 check --workspace --all-targets --all-features"

[tasks.deny]
description = "Advisories and licences over the whole tree"
# **In `gate` since CI was disabled**, for `msrv`'s reason. It fetches the
# advisory database, so it needs the network on every push — which is what kept
# it out while CI ran it.
#
# It is placed early in `gate`, ahead of anything that compiles: it is the one
# check whose result can change without the tree changing, and it costs seconds.
run = "cargo deny check"
