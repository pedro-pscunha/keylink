# keylink's gate, defined once — and now defined only here.
#
# **CI is off by decision, and this file is the whole gate.** `afdbeb3` deleted the
# workflow from `main` and moved what only it ran here in the same commit, which is
# what made that safe. Two independent things hold the state — the Actions setting
# is off, and `main` carries no workflow file — and CONTRIBUTING.md holds that
# measurement, so this file keeps no second copy of it.
#
# The workflow used to call these same tasks, which is why nothing here had to
# change when it went: there was never a second copy of the commands. What did
# change is that a green `mise run gate` is no longer a prediction about a second
# run somewhere else. It is the run. See README.md for what that costs.
#
#   mise tasks           # every task
#   mise run gate        # the whole gate
#   mise run pre-commit  # the fast subset the commit hook runs
#   mise run pre-push    # the heavy subset the push hook runs
#
# The compiler, its components and the wasm target come from rust-toolchain.toml,
# because rustup is the only thing that can install a component. mise owns the
# task layer and the tools cargo does not ship.
#
# `[task_config].includes` is deliberately NOT set: setting it replaces
# auto-discovery entirely, so a new file task under .mise/tasks/ would silently
# not load until somebody remembered to list it.

[tools]
# Pinned here so a fresh clone and CI get the same advisory checker, and so the
# version that produced a green `mise run deny` is recorded.
#
# `aqua:` rather than `cargo:` — the cargo backend compiles cargo-deny from
# source and takes minutes. It is also the backend this developer's global mise
# config already uses for the same tool, so the two share one install path
# instead of fetching the same binary twice under different schemes.
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"

# The `framing` task is a grep, and a grep whose tool is "whatever is on PATH"
# is a gate that passes on a machine without it. Pinned so it fails the same way
# everywhere, including on a CI image that does not ship ripgrep.
"aqua:BurntSushi/ripgrep" = "15.2.0"

# The shared compilation cache. Pinned for the same reason as the two above: a
# cache that is present on one machine and absent on another produces two
# different build times and one confused bug report.
"aqua:mozilla/sccache" = "0.19.0"

# The harness `mise run wasm-browser` runs keylink's wasm module under. It is
# the `wasm-bindgen-test-runner` binary out of the wasm-bindgen release archive;
# `filter_bins` exposes only it, because that archive also carries `wasm-bindgen`
# itself and `wasm2es6js`, which nothing here uses. It was `[exe=...]` until mise
# 2026.10 refused that option on the `github` backend ("option `exe` is not used
# by the github backend") and stopped installing the tool at all.
#
# **The version is not a preference, it is Cargo.lock.** The runner refuses a
# module built against a different `wasm-bindgen` and says so by version, so
# this number and the `wasm-bindgen` line in `Cargo.lock` move together. If a
# `cargo update` bumps that crate, `wasm-browser` goes red until this follows —
# which is the right way round, and cheaper than the alternative of finding out
# in a browser console.
#
# `github:` and not `ubi:`, unlike the line above: mise now warns that the `ubi`
# backend is deprecated and removed in 2027.1. Same resolver, current spelling.
"github:wasm-bindgen/wasm-bindgen" = { version = "0.2.130", filter_bins = "wasm-bindgen-test-runner" }

# The WebDriver the runner drives Chrome through. Pinned so that the gate runs
# in a browser that is the same one everywhere, and so a machine without a
# driver fails at the tool layer with a name rather than inside a test.
#
# **This pin is coupled to the installed Chrome, not to keylink.** chromedriver
# refuses a browser whose MAJOR version differs from its own, so a Chrome that
# auto-updates past 155 reddens `wasm-browser` with
# `This version of ChromeDriver only supports Chrome version 155`. The fix is to
# move this number to the new Chrome, not to bypass the task. Chrome for Testing
# would remove the coupling by downloading its own browser — about 150 MB per
# machine — and that trade was refused: a real browser already on the machine is
# the one worth testing against.
#
# `asdf:` because there is no aqua entry and chromedriver has no GitHub release
# to point `github:` at. The plugin fetches from Chrome for Testing's own
# endpoint, once, at install time. Nothing downloads at test time.
"asdf:mise-plugins/mise-chromedriver" = "155.0.8059.84"

# ── the build environment ───────────────────────────────────────────────────

[env]
# **Why a cache and not a shared target directory.**
#
# Ten agents on ten worktrees is the working pattern here, and cargo offers no
# safe way for them to share build output. Sharing one `CARGO_TARGET_DIR` takes
# cargo's per-directory lock, which serializes every worktree, AND races: one
# build overwrites an `.rmeta` another rustc is still reading. rust-lang/cargo
# issue 16804 documents both, and states there is no third option in cargo.
#
# `keylink/tests/drift.rs` makes it worse than that — it runs `cargo build`
# inside a test, so a shared lock would deadlock it against any other worktree's
# gate.
#
# So each worktree keeps its OWN target directory, which is what makes the
# agents independent, and the sharing happens one layer down in sccache.
# Registry dependencies compile from the same path in every worktree, so they
# hit the cache across worktrees; only this workspace's own crates miss.
RUSTC_WRAPPER = "sccache"

# Not a preference — sccache cannot cache an incremental build, so leaving this
# on silently disables the cache. It is also the disk lever: measured across 13
# worktrees, `target/debug/incremental` was 107 GiB, 45% of ALL build bytes,
# while duplicated dependency artifacts were only about 29 GiB. Incremental
# state is per-worktree and no cache can ever deduplicate it.
#
# The cost is a slower single-worktree edit loop. Override it per shell with
# `CARGO_INCREMENTAL=1` when you are iterating by hand rather than gating.
CARGO_INCREMENTAL = "0"

# ── the whole gate ──────────────────────────────────────────────────────────

[tasks.gate]
description = "The whole gate. There is no other one — CI is off by decision"
# A list of task references runs them ONE AT A TIME, in order. Bare `depends`
# lets mise parallelize, and parallel cargo invocations contend for the same
# target directory and the same memory.
#
# **This used to be "everything CI runs", and CI ran three things it did not.**
# When the workflow was deleted, `wasm-guards`, `msrv` and `deny` were the
# difference, so they moved here in the same change. Disabling a gate and
# dropping what only it covered are two separate acts, and doing the first
# without the second is how coverage disappears without anybody deciding to
# drop it.
#
# Cheapest failures first, with one deliberate exception: `deny` needs no
# compile at all and sits early, so a fresh advisory fails in seconds rather
# than after the test suite.
run = [
    { task = "framing" },
    { task = "anchors" },
    # Immediately after the task it guards, and in both lists rather than only in
    # `pre-commit`, because `anchors` is in both: a guard that does not run where the
    # thing it guards runs is a guard on paper. It asserts that `anchors` reports each
    # failure class as itself — the defect that reached `main` once was a passing gate
    # printing the anchor-rot playbook, which no green/red check can see.
    { task = "anchors-selftest" },
    # `mise.toml` defines `pre-commit` once and three other files restate it; this
    # asserts they still agree. Text only, so it costs nothing and cannot recurse.
    # In `gate` and deliberately NOT in `pre-commit`, unlike `anchors-selftest`
    # above it: the commit hook's filter looks for Rust, and none of the four files
    # this reads is Rust, so there it would fire only by coincidence. The task's own
    # header argues that out.
    { task = "task-lists" },
    { task = "fmt-check" },
    { task = "deny" },
    # `replay-anchors` replays each `REDNESS` row's break and scores the result. That
    # task is in no list and cannot be: it edits the tree and runs one `cargo test`
    # per row. Its `--selftest` arm is the opposite — it feeds the classifier
    # synthetic transcripts, edits nothing, runs no cargo, and writes only under the
    # system temp directory — a scratch directory and one output sink, both of which
    # it removes. "Writes only under the temp directory" was true and silent about
    # removal while it leaked one directory per run, so the removal is stated here
    # rather than left for a reader to assume.
    #
    # **The `anchors-selftest` precedent above does NOT apply here, and copying its
    # sentence would be a false reason.** That one runs immediately after the task it
    # guards because that task is in this list. The task THIS one guards is in no
    # list — which is the argument for the step rather than against it. A hand-run
    # replayer whose classifier is also only ever hand-run has nothing pinning it,
    # and four watched breaks redden this classifier today.
    #
    # So it is placed by this list's own rule instead, cheapest failures first — and
    # LAST among the steps that need no compile, immediately above `lint`, which is
    # the first step that does. It cannot be as cheap as those neighbours: its floor
    # is the two seconds its kill probe waits, read off that constant rather than
    # timed. **It sat above `fmt-check` until a reviewer timed it**, which made this
    # paragraph cite a rule the entry did not follow. Timed three times each on
    # 2026-08-09, `fmt-check` and `deny` both ran inside that two-second floor and
    # this ran just over it. Only the ORDER is claimed: the figures included mise's
    # own startup, and the machine was running other work.
    #
    # NOT in `pre-commit`, for `task-lists`' reason a few lines above — the commit
    # hook's filter tests for Rust, and this task's subject is a Python file under
    # `.mise/tasks/`, so there it would fire only by coincidence.
    #
    # `args` rather than a flag inside the task name: mise passes an args list
    # through as given, so this does not depend on how a wrapper parses `--selftest`.
    # The task exits 1 when handed a row name, so this must stay its only argument.
    { task = "replay-anchors", args = ["--selftest"] },
    { task = "lint" },
    { task = "features" },
    { task = "test" },
    { task = "examples" },
    { task = "docs" },
    { task = "wasm" },
    { task = "wasm-guards" },
    { task = "wasm-web" },
    # Last of the four, because it is the only one that needs a browser and the
    # three above it narrow the failure: a red `wasm` is a link problem, a red
    # `wasm-web` is the `web` feature, and a red `wasm-browser` after two greens
    # is keylink not working where it says it works.
    { task = "wasm-browser" },
    { task = "package" },
    { task = "msrv" },
]

# ── what the hooks run ──────────────────────────────────────────────────────

[tasks.pre-commit]
description = "Fast enough that nobody is tempted to bypass it. Seconds, warm"
run = [
    { task = "framing" },
    { task = "anchors" },
    { task = "anchors-selftest" },
    { task = "fmt-check" },
    { task = "lint-fast" },
]

[tasks.pre-push]
description = "The heavy gate. A push is rarer than a commit"
run = [{ task = "gate" }]

[tasks.hook-guard]
description = "Both hooks gate the thing they are actually about"
# Deliberately in NEITHER `gate`, `pre-commit` nor `pre-push`. It drives
# `git commit` and `git push` in throwaway repositories, which is fast and is also
# the one thing a hook must not do from inside itself: wiring it into `pre-commit`
# would have the commit hook run a script that commits, and wiring it into
# `pre-push` would have the push hook run a script that pushes.
#
# It names what it drives and no longer counts it. The count that used to be here
# said `four times`, which the script had already outgrown.
#
# It is here so that the guard is reachable the way every other check in this repo
# is, rather than being a file somebody has to know about. Run it after touching
# either hook; the script's own header carries the breaks that redden each part and
# names the rows each one reddened.
run = "./scripts/hook-guard.sh"

# ── formatting ──────────────────────────────────────────────────────────────

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Fail if anything is unformatted"
run = "cargo fmt --all -- --check"

# ── linting ─────────────────────────────────────────────────────────────────

[tasks.lint-fast]
description = "Clippy on the library only, so the commit hook stays seconds"
# Catches what a --all-targets run would, minus the test and example targets
# that dominate the build time.
run = "cargo clippy -p keylink --lib --all-features -- -D warnings"

[tasks.lint]
description = "Clippy at both feature ends, every target"
# `--no-default-features` is scoped to the library, and the reason it gives has
# CHANGED. It used to be that the integration tests could not compile without the
# blocking API; they can now, and `.mise/tasks/features` runs
# `cargo check -p keylink --all-targets --no-default-features` to keep it that way.
#
# It stays `--lib` here on cost. Clippy over keylink's test and example targets at
# a second feature resolution is a full extra build of the most expensive targets
# in the workspace, and `features` already answers the question this line would
# answer — does the all-off end compile — for one `cargo check`. What is still
# unchecked is a clippy LINT that fires only without a feature and only in a test.
# Named rather than closed: it is the cheaper half of a check nothing had at all
# until the targets started compiling.
run = [
    "cargo clippy --all-targets --all-features -- -D warnings",
    # The aggregate is `test = false`, so `--all-targets` deliberately skips it.
    # Select it here: it is executable gate code, not an unlinted build artifact.
    "cargo clippy -p keylink --test gate --all-features -- -D warnings",
    "cargo clippy -p keylink --lib --no-default-features -- -D warnings",
]

# ── tests ───────────────────────────────────────────────────────────────────

[tasks.test]
description = "Every test once, with native integration suites sharing one process"
# Starting one process PER TEST made the socket-heavy suite take about ten
# minutes under nextest: each process paid iroh's teardown cost, and twelve of
# them fought over the same endpoint resources. Plain Cargo avoids that mistake
# but starts one process per integration FILE, paying the same two-second drain
# repeatedly.
#
# `gate-tests/gate.rs` is the middle ground: ordinary native integration files
# remain independently runnable, while this command includes the safe ones as
# modules in one libtest process. Five suites stay separate: two use process-wide
# measurements, drift runs nested Cargo, `keyed_topic_allocation` owns a
# process-global allocator, and reliable needs scheduling-sensitive handshake
# evidence. The manifest marks the aggregate `test = false`, so an ordinary
# `cargo test` does not run everything twice. Its inventory test fails if a test
# file is omitted or an isolated suite loses its exact native/browser selector.
#
# Unit tests and keylink's native integrations share one workspace feature
# resolution. A wildcard second selection picks up every integration target in
# other current or future workspace members; keylink's inventory guard owns its
# exceptional selection. `--no-fail-fast` reports later targets after one fails.
# Doctests need their own command whenever Cargo target selectors are present.
run = [
    "cargo test --workspace --lib --bins --test gate --test actor_memory --test drift --test keyed_topic_allocation --test mailbox_latency --test reliable --no-fail-fast",
    "cargo test --workspace --exclude keylink --test '*' --no-fail-fast",
    "cargo test --workspace --doc --no-fail-fast",
]

[tasks.examples]
description = "Every example RUNS. Building one asserts nothing"
# `cargo test --workspace` compiles the examples and never executes one, so
# `reliable_call`'s assertions — the retry did not re-run the work, and the key
# settled `Done` afterwards — were dead code in the gate while the README said
# the recipe was "compiled by the gate and run over two nodes". Half of that was
# true.
#
# Named one at a time rather than `--examples`, because that flag builds them
# and there is no cargo verb that runs them all. A new example must be added
# here, and a reviewer who notices it is missing is the only check there is.
run = [
    "cargo run -p keylink --example reliable_call",
    "cargo run -p keylink --example payment_approval",
    "cargo run -p keylink --example firmware_depot",
    "cargo run -p keylink --example match_room",
    "cargo run -p keylink --example trading_desk",
    "cargo run -p keylink --example substation",
    "cargo run -p keylink --example durable_ledger",
    "cargo run -p keylink --example replay_guard",
    "cargo run -p keylink --example gatehouse",
    "cargo run -p keylink --example toll_booth",
    "cargo run -p keylink --example control_room",
    "cargo run -p keylink --example noticeboard",
    "cargo run -p keylink --example foundry",
    "cargo run -p keylink --example toolroom",
    "cargo run -p keylink --example bridge",
    "cargo run -p keylink --example waypoint",
    "cargo run -p keylink --example wire_contract",
    "cargo run -p keylink --example fault_lines",
    # The one example that is not at default features. `blobs-fs` is off by
    # default and `required-features` makes cargo SKIP the target rather than
    # build it, so without this flag the line below would run nothing and say
    # nothing.
    "cargo run -p keylink --features blobs-fs --example cold_store",
    { task = "http-smoke" },
    { task = "http-smoke-full" },
]

# ── documentation ───────────────────────────────────────────────────────────

[tasks.docs]
description = "rustdoc as a gate, not as decoration"
# `#![warn(missing_docs)]` is a warning, and a warning nothing denies is
# decoration. This is what turns it into a gate, and it catches broken
# intra-doc links in the same pass.
#
# `keylink-persist` declares `missing_docs` too and was not listed here, so its
# own gate was decoration until this line named it.
#
# `--document-private-items` is what makes that true of more than the public
# surface. WITHOUT it, rustdoc resolves no intra-doc link in a private item at
# all — not the item and not its doc comment — which in this crate is every
# private module's header and most of the prose a maintainer reads. The flag was
# off while 49 errors stood behind it, and the commit before this one is the pass
# that cleared them: 7 links that resolved to nothing, and 42 reports of
# `rustdoc::redundant_explicit_links` over 24 lines. The lint is not allowed. An
# allow would hide the next instance, and that class is the first thing a reader
# meets on the day somebody writes `[`X`](X)` again.
#
# Do not carry a number out of this comment. What the flag covers is the claim;
# what it costs is one `cargo doc` invocation, the same one, with one more flag.
#
# ── THREE KNOWN HOLES IN THIS GATE. All three measured, none closed here.
#
# 1. A `#[cfg(test)] mod` is NOT reached, flag or no flag, and the comment this
#    replaced said the opposite — it listed "every break record in a unit-test
#    module" among what the flag would buy. It buys none of them.
#
#    THE DECISIVE EVIDENCE IS A THREE-ARM CONTROL, in one run, and the third arm
#    came from the merge-gate reviewer rather than from this branch. Three broken
#    links in `authz.rs`, one rustdoc pass, 2 errors:
#
#      PubItemNoSuchItem                on a `pub` method        REPORTED
#      NonCfgPrivateModuleNoSuchItem    private mod, no cfg      REPORTED
#      InsideCfgTestModNoSuchItem       inside `#[cfg(test)] mod`  silent
#
#    **The middle arm is what makes this isolation rather than correlation.** The
#    first version of this control had two arms — the cfg one against a `pub`
#    method — which differ in TWO ways: the cfg, and being public with a
#    re-exported path. The reviewer added a private module in the same file,
#    identical in privacy and nesting and differing only by having no
#    `#[cfg(test)]`. It is REPORTED, so privacy and nesting are ruled out and the
#    cfg is the isolated variable. Reproduced here before being written down.
#
#    Without any control at all, silence and "rustdoc never ran" are one output.
#
#    Corroborating, and NOT decisive on its own: rustdoc emits no page for such a
#    module. `target/doc/keylink/authz/` holds `enum.Allowlist.html`,
#    `struct.AdmittedPeer.html`, `struct.ProvenPeer.html`, `index.html` and
#    `sidebar-items.js`, and `find target/doc/keylink -iname '*tests*'` returns
#    nothing. Weaker because an absent page has several explanations besides this
#    one — an item with no public path, a naming scheme nobody predicted, output
#    written somewhere this search did not look. It agrees with the control rather
#    than standing in for it.
#
#    THE MECHANISM IS NOW HALF OBSERVED, and the boundary is worth being exact
#    about. `cargo doc -v` prints every rustdoc invocation, and all three carry
#    ONLY `feature="…"` cfgs — no bare `test` cfg and no `--test` flag. So "cargo
#    passes no test cfg" is a measurement, not a belief.
#
#    A grep returning nothing is not a finding on its own, so the pattern was fed
#    a synthetic line carrying `--cfg 'test'` and `--test` first: it matched 2. The
#    same pattern against the real `-v` log matches 0.
#
#    **What stays unverified is the step from "no test cfg" to "the item is gone
#    before rustdoc documents it".** That is language semantics rather than
#    anything this task can measure, and it is the only part still inferred.
#
#    `lib.rs`'s own reasoning beside `extern crate self as keylink` reaches the
#    same conclusion from the other direction: `representability.rs` expands
#    `service!` and never hit the link failures, "because rustdoc does not render
#    test-only code". Two independent statements, one measured and one reasoned,
#    and the replaced comment contradicted both.
#
# 2. `tests/*.rs` is unreachable EITHER WAY. cargo builds integration tests as
#    separate crates and never hands them to rustdoc, so a broken intra-doc link
#    in `keylink/tests/` is invisible to every gate here. It happened: an
#    `APPLIED_CAPACITY` -> `APPLIED_BOUND` rename left a dangling
#    `[`APPLIED_CAPACITY`]` in `tests/persist.rs` and this task stayed green.
#    There is no cheap fix — `cargo rustdoc -p keylink --test persist` cannot
#    link the crate graph — so the standing remedy is to grep for the old name
#    after any rename that touches a documented item. Stated rather than worked
#    around, because a workaround nobody maintains is worse than a known hole.
#
# 3. A link inside the `service!` body is linted for KEYLINK and for nobody
#    else, so `crate::` where `keylink::` was meant is undetectable. The macro
#    body IS expanded and IS linted here — the `Addressed` link this task's
#    predecessor left broken was reported at `macros.rs`, from an expansion, and
#    only under `--document-private-items`. What no rustdoc run reaches is the
#    same link expanded in a crate that is NOT keylink, where `crate::` means
#    that crate.
#
#    MEASURED, and it refuted the plan that put `demo` here: `send_to`'s
#    `[`Addressed`](keylink::Addressed)` was rewritten to `crate::Addressed`.
#    keylink stayed green, correctly — `crate::` is keylink there. `demo`, which
#    expands the same macro and imports no `Addressed`, ALSO stayed green, at
#    exit 0. rustdoc does not lint an intra-doc link whose doc comment came from
#    another crate's macro, which is reasonable of it — a downstream crate cannot
#    fix an upstream macro — and it means no gate step can be bought here. The
#    standing remedy is the convention `macros.rs` already follows everywhere:
#    inside the macro body, write `keylink::Foo`, never `crate::Foo`.
#
# `demo` is documented anyway, and the reason is bigger than the one it replaced.
# **It TRIPLES the number of `service!` expansions rustdoc checks, from one to
# three.** Derived, not counted by hand — a generated service module is the
# directory holding a `trait.Actor.html`, and after this task runs there are
# exactly three:
#
#   target/doc/keylink/console/inspect      `Inspect`, the only one before this
#   target/doc/demo/inventory               \  the two `-p demo` adds
#   target/doc/demo/dock                    /
#
# `representability.rs` expands the macro too and is NOT among them, which is
# `lib.rs`'s "rustdoc does not render test-only code" showing up as an absence.
#
# It also widens which METHOD KINDS are checked at all. `Inspect` declares `rpc`,
# `#[defer] rpc` and `feed`; `demo` adds `recv` and `send`. Neither declares `tell`
# or `blob`, so those two kinds stay unchecked either way — stated because a
# reader counting three expansions could otherwise assume the macro is covered.
#
# And its OWN prose, which is where this started. `main.rs`'s header had
# `cargo run -p demo -- connect <endpoint-id>` in a 3-space indent, which is a
# paragraph and not a code block, so rustdoc read `<endpoint-id>` as an HTML tag.
# The line dates from 5939216 — `git log -1 -L4,4:demo/src/main.rs`, which is the
# line's own commit and not the file's last touch — so it had been broken for as
# long as it had existed, with nothing in the repository able to say so. It is a
# fenced block now.
#
# WATCHED, on the exact line this task runs: putting the 3-space indent back gave
# exit 101, `error: unclosed HTML tag 'endpoint-id'` at `demo/src/main.rs:4:36`,
# and `error: could not document 'demo'` — two error lines, one diagnostic. Not
# registered in `.mise/tasks/anchors`: a row there is a source line
# `break-once.sh` flips to redden a TEST, and this is a claim about rustdoc, so it
# is described here instead — the third option that task's own header allows.
#
# One invocation and not two. Selecting `demo` costs one extra rustdoc unit and
# saves a dependency rebuild, and the reason is which FEATURE RESOLUTION each
# selection asks for: `lint` and `test` both build the whole workspace, so the
# resolution that INCLUDES `demo` is the one already materialised when this step
# runs. A `-p keylink -p keylink-persist` selection is the odd one out — its
# narrower package set resolves features differently, so it needs dependency
# artifacts nothing else in the gate builds.
#
# MEASURED with a cleaned doc dir and the workspace check restored BEFORE EACH
# form, run in both orders. Two columns, and they point opposite ways:
#
#                             Documenting   Checking (first use)
#   this line, with `-p demo`      3              0
#   the same line without it       2             12
#   `--workspace` afterwards       0              0   — neither invalidates `lint`
#
# **An earlier version of this table said 1 in the Documenting column, and that
# number was the ONLY thing in it supporting the word "cheaper".** It came from a
# procedure that ran the workspace check once at the start rather than before each
# form, on a doc dir this form had already populated, so it counted `demo` alone.
# From a clean doc dir it is 3, in either order. The real Documenting comparison,
# 3 against 2, mildly OPPOSES the conclusion; the `Checking` column carries it.
#
# The 12 is ONE observation, not a stable figure: reproducing it needs the
# two-crate resolution's dependency artifacts absent, and `cargo clean --doc` does
# not arrange that. What is stable across every ordering is 3 against 2 documented
# and 0 against non-zero compiled.
#
# In package terms `demo` adds exactly TWO that `-p keylink --all-features` does
# not already compile, `anyhow` and `demo` itself, derived by comparing
# `cargo tree -p demo --prefix none --no-dedupe` with the same for keylink.
#
# **The cold-tree cost is NOT established, for either form.** A separate
# `cargo doc -p demo` invocation on a tree that has never built demo's doc profile
# was measured elsewhere at 31 `Checking` lines. That is a real number about a
# different command, and it is why this is one invocation and not two.
#
# `--all-features` reaches `demo`'s `swap-variants` here, which is the feature
# that reorders two variants to prove the ALPN refuses the handshake. It changes
# which variants the generated docs list and nothing else; no rustdoc check in
# this repository depends on their order.
#
# `headings` runs first and is not a gate step of its own — it is inside this
# one, because it checks the same artifact and takes no compile. **No ordinal here
# on purpose:** this sentence said "a seventeenth gate step" and was CORRECT when it
# was written, against a list of sixteen. `task-lists` and `replay-anchors` joined
# that list afterwards, so it was two out by the time anybody read it again, and the
# point it makes never depended on the number. It reads tracked
# FILES rather than rustdoc's output, so it sees inside `keylink/tests/`, where
# one of the six headings it was written against lived.
#
# **That does not close hole 2, and saying it did would be the same trade this
# comment keeps refusing.** Hole 2 is about intra-doc LINKS, and a broken one in
# `keylink/tests/` is still invisible to everything here. What `headings` shows is
# narrower and still worth having: for one defect class, reading the file is the
# whole instrument, so the hole does not apply to it.
#
# Cheapest first, as everywhere else in this gate.
run = [
    { task = "headings" },
    "RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --document-private-items --all-features -p keylink -p keylink-persist -p keylink-http -p keylink-openapi -p demo",
]

# ── shipping ────────────────────────────────────────────────────────────────

[tasks.package]
description = "Every publishable workspace crate still packages"
# A manifest can stop being publishable without one line of code changing, and
# nothing else in this gate looks. It happened: Wave 5 promoted `keylink-persist`
# from a dev-dependency to a real one, and cargo strips unversioned dev-deps when
# it packages — so `keylink` went from packaging fine to
# `error: all dependencies must have a version requirement specified when
# packaging`, silently, in a commit about durability. `keylink-persist` was also
# `publish = false`, which would have refused the publish a second way.
#
# `--no-verify` skips the rebuild from the packaged tarball, which the rest of
# this gate has already done from the same sources. What is being checked is the
# manifest, and that is what fails.
#
# `--allow-dirty` because this runs on a working tree, including in the commit
# path.
#
# `--exclude demo` and not `-p keylink -p keylink-persist`: `demo` is
# `publish = false` and depends on `keylink` by path with no version, which is
# correct for a demo and is a manifest error for anything shipped. Excluding by
# name means a NEW workspace member is checked by default, which is the way round
# that fails loudly.
# `--exclude imported-ledger` for the same reason as `demo`: it is a test
# fixture whose only purpose is to be depended on from another crate's tests,
# it depends on `keylink` by path with no version, and publishing it would mean
# nothing. `keylink-openapi` is NOT excluded — it is an opt-in crate a real
# downstream user has to be able to depend on, so its path deps carry versions
# and it packages like every other shipped crate.
run = "cargo package --workspace --exclude demo --exclude imported-ledger --no-verify --allow-dirty"

# ── supply chain ────────────────────────────────────────────────────────────

[tasks.msrv]
description = "Compile on the oldest Rust keylink claims to support"
# **In `gate` since the workflow was deleted, and the cost it used to dodge is
# real.** It
# needs a second toolchain — a ~200 MB download the first time — which is why it
# sat outside the gate while CI carried it. Nobody carries it now, and an MSRV
# nobody compiles is a promise broken silently: `rust-version` changes what cargo
# tells a user on an old compiler, so a wrong one sends them to the wrong place.
#
# Paying it once per clone beat dropping the guarantee. If that trade stops being
# worth it, take this out of `gate` **and** say who runs it instead — not one
# without the other.
run = "cargo +1.91 check --workspace --all-targets --all-features"

[tasks.deny]
description = "Advisories and licences over the whole tree"
# **In `gate` since the workflow was deleted**, for `msrv`'s reason. It fetches the
# advisory database, so it needs the network on every push — which is what kept
# it out while CI ran it.
#
# It is placed early in `gate`, ahead of anything that compiles: it is the one
# check whose result can change without the tree changing, and it costs seconds.
run = "cargo deny check"
