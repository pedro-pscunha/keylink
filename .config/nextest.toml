# nextest runs test binaries as parallel processes. `cargo test` ran them one at
# a time, which is where 73.4s of a 100s gate went.
#
# One thing here is load-bearing rather than tuning. Read it before changing it.

[profile.default]
# 18 cores, and these tests bind real loopback sockets and spawn child
# processes rather than saturating a CPU. Left at the default (one thread per
# core) the socket-heavy binaries thrash each other.
test-threads = 12

# nextest stops at the first failure by default. `cargo test` did not — it ran
# every test in a binary and reported all of them — so keeping the default would
# have made this gate report LESS than the command it replaced.
#
# That trade is bad here specifically because GitHub Actions is disabled: this
# hook is the only checker, and each red run costs another full gate to find the
# next failure.
fail-fast = false

# A test that takes longer than this gets named in the output instead of
# silently costing a minute. It does not fail the run — `period` warns, and
# nothing terminates unless `terminate-after` is set, which it is not.
slow-timeout = { period = "20s" }

# ── the one that is not tuning ──────────────────────────────────────────────
#
# `keylink/tests/drift.rs` runs `cargo build --package demo` INSIDE the test,
# twice, with two different feature sets, and copies each result to a fixed
# path. It guarded that with a `OnceLock` so two test THREADS could not run two
# cargo processes at each other.
#
# nextest gives every test its own PROCESS, and a `OnceLock` does not span
# processes. Both tests would then build and copy at once.
#
# **What that costs, stated accurately.** An earlier draft of this comment said
# the file would "compare a binary against itself and PASS — green, with the
# guard dead". That is wrong, and the wrongness is worth recording: `drift.rs:238`
# asserts `assert_ne!` on the two ALPNs, so two identical copies make it FAIL.
# The real damage is a test that reddens at random depending on which process
# copied last, plus two concurrent `cargo build` invocations fighting for the
# machine. A flaky red is not a silent green, and a record that claims the worse
# failure is a record a reader can disprove.
#
# This group is what replaces the `OnceLock` across processes. Serialized, the
# second process finds a warm build and rewrites the same bytes.
#
# ── THE BREAK, RUN AND WATCHED ──────────────────────────────────────────────
#
# Not quoted, because the break is a deletion and `break-once.sh` runs `cargo
# test`, under which this file does nothing at all — that harness cannot reach
# this guard. Described instead, per CONTRIBUTING.md.
#
# The edit: delete the `[[profile.default.overrides]]` block below, so no group
# applies to `binary(drift)`. Then `cargo nextest run --test drift`.
#
# Watched on 2026-08-08:
#   with the group     2 passed, 10.621s total  — 9.510s + 1.111s, a SUM, which
#                      is itself the evidence that they did not overlap
#   without the group  1 passed, 1 FAILED in 0.765s,
#                      a_peer_built_from_other_types_is_refused_at_the_handshake
#   restored           2 passed, 2.081s
#
# So the failure is a red, and a load-dependent one. Do not expect it every run.
[test-groups.drift-builds]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(drift)'
test-group = 'drift-builds'
# The group serializes drift against drift, never against the other 11 binaries.
# The build it runs spawns its own rustc jobs, and that spike lands on neighbours
# that carry wall-clock ceilings. Reserving every slot keeps the spike alone.
threads-required = 'num-test-threads'
