[package]
name = "demo"
version = "0.1.0"
edition = "2021"
# Matches keylink's. Without it `cargo deny check` reports the workspace's own
# crate as unlicensed, which is a true finding about this file rather than noise
# to configure away.
license = "MIT OR Apache-2.0"
publish = false

[features]
# Reorders two identically shaped enum variants. postcard encodes them by
# declaration index, so a peer built with this feature misparses every price
# without erroring. The schema-derived ALPN turns that into a refused handshake:
# build this crate twice, once with the feature, and the two binaries cannot
# talk to each other at all.
swap-variants = []
# Build the frozen version 2 contract from the same keylink wire revision.
previous-contract = []

[dependencies]
keylink = { path = "../keylink" }
serde = { workspace = true }
postcard-schema = { workspace = true }
tokio = { workspace = true }
anyhow = "1"
# For `Instant` only. This binary is native and would survive `std::time`, but
# the no-`std::time::Instant` invariant is written without a target exemption,
# and a rule with one documented exception is a rule the next reader argues with.
n0-future = { workspace = true }

[lints]
workspace = true
