[workspace]
members = [
    "keylink",
    "keylink-persist",
    "keylink-http",
    "keylink-openapi",
    "demo",
    "fixtures/imported-ledger",
]
resolver = "2"

[workspace.dependencies]
# The browser-safe feature set, which is the smaller one. `keylink` adds
# `metrics`, `portmapper` and `fast-apple-datapath` back for native in its own
# target block, and cargo unions the two sets per target.
#
# Putting `default-features = false` here and nowhere else would silently remove
# NAT port mapping from every native build and degrade connectivity on real
# networks. Check with `cargo tree -e features`.
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
# The portable runtime shim. Spawn, time and streams that compile for a browser
# as well as for a thread pool.
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
postcard-schema = { version = "0.2", features = ["derive", "use-std"] }
postcard-rpc = "0.12"
# For `demo` only. `keylink` declares tokio itself, scoped per target.
tokio = { version = "1", features = ["full"] }
bytes = "1"
axum = "0.8"
http = "1"
http-body-util = "0.1"
base64 = "0.23"
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
mime = "0.3"
serde_json = "1"
blake3 = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
thiserror = "2"
pastey = "0.2"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

# `missing_docs` is not here: it belongs to the library, which declares it
# itself, and a binary has no public API to document.
#
# `unwrap` and `expect` are denied by the compiler, not by promise. Test modules
# opt out explicitly at the top of the file, which is the only place they are
# allowed.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
# One module-file layout, held by the gate rather than by habit.
# `keylink/src/actor/mod.rs` and `keylink/src/compose/mod.rs` are the only
# directory modules in the workspace, so this is a no-op on the tree as it
# stands and a refusal on the first `foo.rs` written beside a `foo/`.
#
# The name reads backwards from what it sounds like: `self_named_module_files`
# DENIES `foo.rs` beside `foo/`, which is the layout this workspace does not
# use. It is in the `restriction` group, which is allow-by-default, so
# `clippy::all` never sees it and every member picks it up through
# `[lints] workspace = true`.
self_named_module_files = "deny"

# ── the dev profile ─────────────────────────────────────────────────────────

[profile.dev]
# Full debuginfo is what the gate was paying for, and nothing in the gate reads
# it. `line-tables-only` keeps what a panic backtrace actually uses — file and
# line — and drops the type and variable descriptions a debugger wants. Run
# `CARGO_PROFILE_DEV_DEBUG=2 cargo test …` for the session where you attach LLDB.
#
# It cuts bytes written and it cuts link time, which is the one part of a Rust
# build that no cache can skip: sccache caches compilation, never linking.
#
# `split-debuginfo` is deliberately NOT set here. macOS already defaults to
# `unpacked` — verified by the absence of any `.dSYM` bundle in `target/debug` —
# so writing it down would be a line that changes nothing and still has to be
# maintained.
debug = "line-tables-only"
