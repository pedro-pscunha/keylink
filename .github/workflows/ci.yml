name: CI

# The gate is defined once, in mise.toml and .mise/tasks/. CI calls those tasks
# rather than restating the commands, so a green `mise run gate` locally means a
# green run here. A second copy of the commands is a second thing to drift.
#
# The toolchain, its components and the wasm target come from
# rust-toolchain.toml, which rustup honors on first use. That is why no job here
# names a component or a target: adding one would be a second place to keep in
# step with the file that already says it.

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: fmt, clippy, features, test, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v2
      - run: mise run fmt-check
      - run: mise run lint
      - run: mise run features
      - run: mise run test
      - run: mise run docs

  wasm:
    name: browser target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v2

      # `build`, not `check`. The failure this job exists to catch is a LINK
      # failure, and `cargo check` stops before the linker runs — it passes
      # green on a tree whose wasm target does not link.
      - run: mise run wasm

      # The three guards must FIRE, not merely be present. A `compile_error!`
      # nobody triggers is a comment. Each of these features needs an OS
      # facility a browser does not have, so each must refuse to build for wasm
      # in keylink's own words rather than 48 errors deep inside mio.
      - name: the feature guards refuse the browser target
        run: |
          set -uo pipefail
          for feature in blocking fs env; do
            if cargo check -p keylink --target wasm32-unknown-unknown \
                 --no-default-features --features "$feature" >/dev/null 2>&1; then
              echo "::error::feature '$feature' built for wasm; its compile_error! guard is gone"
              exit 1
            fi
            echo "ok: '$feature' refuses the browser target"
          done

  msrv:
    name: oldest supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both toolchains: the pinned one compiles, and stable is what
      # rust-toolchain.toml would otherwise pull in for the `cargo` driver.
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v2

      # `rust-version` in keylink/Cargo.toml says 1.91. An MSRV nobody compiles
      # is a promise broken silently: the number changes what cargo tells a user
      # on an old compiler, so a wrong one sends them somewhere unhelpful.
      - run: mise run msrv

  supply-chain:
    name: advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mise-action@v2
      - run: mise run deny
